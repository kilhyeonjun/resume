<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 718 280" width="718" height="280" font-family="Arial, sans-serif">

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#9ca3af"/>
    </marker>
    <marker id="arrd" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="718" height="280" fill="#f9fafb" rx="8"/>

  <!-- Title -->
  <text x="359" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">대신물류 실시간 배송 조회 시스템 아키텍처</text>
  <text x="359" y="40" text-anchor="middle" font-size="9.5" fill="#6b7280">VPS Docker + Traefik Blue/Green  |  Cheerio 크롤러  |  KakaoTalk Skill  |  Vercel Next.js</text>

  <!-- ─────────────────────────────────────────────────────────────
       LEFT: External site + Vercel
       ───────────────────────────────────────────────────────────── -->

  <!-- External logistics site -->
  <rect x="20" y="56" width="126" height="48" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="83" y="74" text-anchor="middle" font-size="10" font-weight="bold" fill="#111827">대신물류 사이트</text>
  <text x="83" y="88" text-anchor="middle" font-size="9" fill="#6b7280">logistics.ds3211.co.kr</text>
  <text x="83" y="100" text-anchor="middle" font-size="9" fill="#6b7280">axios POST / EUC-KR</text>

  <!-- Vercel (bottom left) -->
  <rect x="20" y="212" width="126" height="52" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <text x="83" y="230" text-anchor="middle" font-size="10" font-weight="bold" fill="#111827">Vercel</text>
  <text x="83" y="245" text-anchor="middle" font-size="9" fill="#6b7280">Next.js 16</text>
  <text x="83" y="259" text-anchor="middle" font-size="9" fill="#6b7280">TanStack Query</text>

  <!-- KakaoTalk (top right outside) -->
  <rect x="572" y="56" width="126" height="48" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="635" y="74" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">KakaoTalk</text>
  <text x="635" y="89" text-anchor="middle" font-size="9" fill="#92400e">카카오 스킬 서버</text>
  <text x="635" y="101" text-anchor="middle" font-size="9" fill="#92400e">/kakao/skill</text>

