<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>AI 코딩 에이전트 관리 플랫폼</title><desc>기기 정책 가드와 사용량 수집 서버의 구성, 가드 정책 배포로 켠 보고 스위치의 집행 기기 수, 수집 서버 장애 전후 수치. 87대는 사람이 아닌 보고 중인 기기 수이며, 내부 서비스명·호스트·정책 대상과 규칙은 제외.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#66736c"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#17211c}.h{font-size:30px;font-weight:800}.s{font-size:15px;fill:#66736c}.k{font-size:11px;font-weight:800;letter-spacing:2px;fill:#66736c}.t{font-size:18px;font-weight:800}.b{font-size:14px;fill:#3d4a43}.was{font-size:15px;fill:#8a958f}.v{font-size:26px;font-weight:800;fill:#0f5132}.box{fill:#fffdfa;stroke:#cfd8d2;stroke-width:2}.hot{fill:#eef6f0;stroke:#6aa47f;stroke-width:2}.ln{stroke:#66736c;stroke-width:2.5;fill:none}</style></defs><rect width="1200" height="675" fill="#f7f5ef"/><text x="40" y="62" class="h">AI 코딩 에이전트 관리 플랫폼</text><text x="40" y="94" class="s">기기 정책 가드 · 사용량 수집 서버 · 메모리 상한 재설계</text><rect x="40" y="124" width="352" height="118" rx="12" class="box"/><text x="64" y="152" class="k">1 · GUARD</text><text x="64" y="184" class="t">기기 정책 가드</text><text x="64" y="214" class="b">차단·감사 기록 · 서명된 규칙</text><path d="M394 183h24" class="ln" marker-end="url(#a)"/><rect x="424" y="124" width="352" height="118" rx="12" class="box"/><text x="448" y="152" class="k">2 · COLLECT</text><text x="448" y="184" class="t">사용량 수집</text><text x="448" y="214" class="b">사용 기록 동기화 · ClickHouse</text><path d="M778 183h24" class="ln" marker-end="url(#a)"/><rect x="808" y="124" width="352" height="118" rx="12" class="box"/><text x="832" y="152" class="k">3 · OPERATE</text><text x="832" y="184" class="t">운영 안정화</text><text x="832" y="214" class="b">상한 순서 · 알람 도달</text><rect x="40" y="274" width="352" height="306" rx="14" class="hot"/><text x="64" y="306" class="k">MACOS · WINDOWS</text><text x="64" y="340" class="t">보고 스위치 집행 기기</text><text x="64" y="388" class="was">활성 명단 92명 배정</text><text x="64" y="410" class="s">↓</text><text x="64" y="446" class="v">87대 전부 집행</text><path d="M64 474h304" stroke="#cfd8d2" stroke-width="1.5"/><text x="64" y="506" class="b">가드 정책 배포 · 카나리 두 대 뒤 전역</text><text x="64" y="534" class="b">보고 중인 온라인 기기 기준</text><rect x="424" y="274" width="352" height="306" rx="14" class="hot"/><text x="448" y="306" class="k">AWS · LIVE</text><text x="448" y="340" class="t">수집 서버 무응답 2회</text><text x="448" y="388" class="was">2일 18시간 · 17시간 40분</text><text x="448" y="410" class="s">↓</text><text x="448" y="446" class="v">상한 재설정 2회</text><path d="M448 474h304" stroke="#cfd8d2" stroke-width="1.5"/><text x="448" y="506" class="b">ClickHouse 예산 · 컨테이너 한도</text><text x="448" y="534" class="b">상한 순서: 앱 · 컨테이너 · 호스트</text><rect x="808" y="274" width="352" height="306" rx="14" class="hot"/><text x="832" y="306" class="k">AWS · LIVE</text><text x="832" y="340" class="t">최대 파일 파싱 피크</text><text x="832" y="388" class="was">770,900kB에서 OOM kill</text><text x="832" y="410" class="s">↓</text><text x="832" y="446" class="v">427.8MiB · 67%</text><path d="M832 474h304" stroke="#cfd8d2" stroke-width="1.5"/><text x="832" y="506" class="b">640MiB 한도 안 · 스트리밍 파싱</text><text x="832" y="534" class="b">O(n²) 재파싱은 후속 과제</text><text x="40" y="626" class="s">공개용 재구성 · 내부 서비스명·호스트·정책 세부 규칙 제외 · 87대는 사람이 아닌 기기 수</text></svg>
