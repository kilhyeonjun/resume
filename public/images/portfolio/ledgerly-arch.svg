<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 718 260" width="718" height="260" font-family="Arial, sans-serif">

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#9ca3af"/>
    </marker>
    <marker id="arrb" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="718" height="260" fill="#f9fafb" rx="8"/>

  <!-- Title -->
  <text x="359" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">Ledgerly 아키텍처</text>
  <text x="359" y="40" text-anchor="middle" font-size="9.5" fill="#6b7280">Vercel (Next.js) + Mac mini Docker (NestJS)  |  공유 Supabase PostgreSQL  |  JWT 단일 인증</text>

  <!-- ─────────────────────────────────────────────────────────────
       LEFT BLOCK: Vercel — Next.js 16
       ───────────────────────────────────────────────────────────── -->

  <!-- Outer container -->
  <rect x="20" y="54" width="260" height="188" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <!-- Header band -->
  <rect x="20" y="54" width="260" height="28" rx="8" fill="#2563eb"/>
  <rect x="20" y="68" width="260" height="14" fill="#2563eb"/>
  <text x="150" y="73" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Vercel — Seoul (icn1)</text>

  <!-- Next.js label -->
  <text x="150" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#111827">Next.js 16  App Router</text>

  <!-- Feature rows -->
  <rect x="38" y="110" width="224" height="26" rx="4" fill="#f3f4f6"/>
  <text x="150" y="128" text-anchor="middle" font-size="9.5" fill="#374151">Server Actions  (CRUD)</text>

  <rect x="38" y="142" width="224" height="26" rx="4" fill="#f3f4f6"/>
  <text x="150" y="160" text-anchor="middle" font-size="9.5" fill="#374151">TanStack Query v5  (클라이언트 상태)</text>

  <rect x="38" y="174" width="224" height="26" rx="4" fill="#f3f4f6"/>
  <text x="150" y="192" text-anchor="middle" font-size="9.5" fill="#374151">Supabase Auth SSR  |  Prisma 7</text>

  <rect x="38" y="206" width="224" height="26" rx="4" fill="#f3f4f6"/>
  <text x="150" y="224" text-anchor="middle" font-size="9.5" fill="#374151">3-tier RBAC  (useCurrentMemberRole)</text>

  <!-- ─────────────────────────────────────────────────────────────
       RIGHT BLOCK: Mac mini Docker — NestJS
       ───────────────────────────────────────────────────────────── -->

  <rect x="438" y="54" width="260" height="188" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <rect x="438" y="54" width="260" height="28" rx="8" fill="#374151"/>
  <rect x="438" y="68" width="260" height="14" fill="#374151"/>
  <text x="568" y="73" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Mac mini — Docker</text>

  <text x="568" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#111827">NestJS 11  Clean Architecture</text>

  <rect x="456" y="110" width="224" height="26" rx="4" fill="#f3f4f6"/>
  <text x="568" y="128" text-anchor="middle" font-size="9.5" fill="#374151">@Cron('0 15 * * *')  반복 거래 처리</text>

  <rect x="456" y="142" width="224" height="26" rx="4" fill="#f3f4f6"/>
  <text x="568" y="160" text-anchor="middle" font-size="9.5" fill="#374151">SupabaseAuthGuard → MembershipGuard</text>

  <rect x="456" y="174" width="224" height="26" rx="4" fill="#f3f4f6"/>
  <text x="568" y="192" text-anchor="middle" font-size="9.5" fill="#374151">Prisma 6  → 공유 Supabase PG</text>

  <rect x="456" y="206" width="224" height="26" rx="4" fill="#f3f4f6"/>
  <text x="568" y="224" text-anchor="middle" font-size="9.5" fill="#374151">Domain / Use-Case / Infra 레이어</text>

  <!-- ─────────────────────────────────────────────────────────────
       CENTER COLUMN: Supabase
       ───────────────────────────────────────────────────────────── -->

  <!-- Supabase Auth -->
  <rect x="299" y="90" width="120" height="50" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="359" y="111" text-anchor="middle" font-size="10" font-weight="bold" fill="#065f46">Supabase Auth</text>
  <text x="359" y="127" text-anchor="middle" font-size="9" fill="#065f46">JWT 공유 검증</text>

  <!-- Supabase PG -->
  <rect x="299" y="160" width="120" height="50" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="359" y="181" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e3a8a">Supabase PostgreSQL</text>
  <text x="359" y="196" text-anchor="middle" font-size="9" fill="#1e40af">Connection Pooler</text>

  <!-- Arrows: Left → Supabase Auth -->
  <line x1="280" y1="110" x2="299" y2="113" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Arrows: Right → Supabase Auth -->
  <line x1="438" y1="113" x2="419" y2="113" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Arrows: Left → Supabase PG -->
  <line x1="280" y1="180" x2="299" y2="183" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrb)"/>
  <!-- Arrows: Right → Supabase PG -->
  <line x1="438" y1="183" x2="419" y2="183" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrb)"/>

  <!-- Vertical connector between Auth and PG (shared foundation) -->
  <line x1="359" y1="140" x2="359" y2="160" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3,3"/>

</svg>
