<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>DB 포화 원인 분석 3건</title><desc>MySQL(RDS) 포화 3건을 계측으로 원인 쿼리까지 좁히고 쿼리·인덱스·작업 단위를 고친 뒤 재발 경로를 막은 흐름과 케이스별 전후 수치. 내부 테이블·메서드명은 일반 명칭으로 대체.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#66736c"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#17211c}.h{font-size:30px;font-weight:800}.s{font-size:15px;fill:#66736c}.k{font-size:11px;font-weight:800;letter-spacing:2px;fill:#66736c}.t{font-size:18px;font-weight:800}.b{font-size:14px;fill:#3d4a43}.was{font-size:15px;fill:#8a958f}.v{font-size:26px;font-weight:800;fill:#0f5132}.box{fill:#fffdfa;stroke:#cfd8d2;stroke-width:2}.hot{fill:#eef6f0;stroke:#6aa47f;stroke-width:2}.ln{stroke:#66736c;stroke-width:2.5;fill:none}</style></defs><rect width="1200" height="675" fill="#f7f5ef"/><text x="40" y="62" class="h">DB 포화 원인 분석 · 3건</text><text x="40" y="94" class="s">MySQL(RDS) · 계측으로 좁히고 쿼리·인덱스로 해결</text><rect x="40" y="124" width="352" height="118" rx="12" class="box"/><text x="64" y="152" class="k">1 · MEASURE</text><text x="64" y="184" class="t">계측 먼저</text><text x="64" y="214" class="b">Performance Insights · EXPLAIN</text><path d="M394 183h24" class="ln" marker-end="url(#a)"/><rect x="424" y="124" width="352" height="118" rx="12" class="box"/><text x="448" y="152" class="k">2 · FIX</text><text x="448" y="184" class="t">쿼리 형태 수정</text><text x="448" y="214" class="b">쿼리 · 인덱스 · 작업 단위</text><path d="M778 183h24" class="ln" marker-end="url(#a)"/><rect x="808" y="124" width="352" height="118" rx="12" class="box"/><text x="832" y="152" class="k">3 · GUARD</text><text x="832" y="184" class="t">재발 경로 차단</text><text x="832" y="214" class="b">실제 DDL 테스트 · 실행당 상한</text><rect x="40" y="274" width="352" height="306" rx="14" class="hot"/><text x="64" y="306" class="k">BACKFILL · LIVE · 15,333건</text><text x="64" y="340" class="t">아카이브 백필 처리량</text><text x="64" y="388" class="was">9.3건/분</text><text x="64" y="410" class="s">↓</text><text x="64" y="446" class="v">247건/분 · 26배</text><path d="M64 474h304" stroke="#cfd8d2" stroke-width="1.5"/><text x="64" y="506" class="b">Lambda p50 63.2s → 1.36s</text><text x="64" y="534" class="b">N+1 → IN() 단일 배치</text><rect x="424" y="274" width="352" height="306" rx="14" class="hot"/><text x="448" y="306" class="k">LIVE</text><text x="448" y="340" class="t">감사 로그 조회 · 2,637만 행</text><text x="448" y="388" class="was">최장 36분 풀스캔</text><text x="448" y="410" class="s">↓</text><text x="448" y="446" class="v">EXPLAIN rows = 3</text><path d="M448 474h304" stroke="#cfd8d2" stroke-width="1.5"/><text x="448" y="506" class="b">누락 인덱스 복구 · 엔티티 선언</text><text x="448" y="534" class="b">실제 DDL 통합 테스트 추가</text><rect x="808" y="274" width="352" height="306" rx="14" class="hot"/><text x="832" y="306" class="k">SANDBOX</text><text x="832" y="340" class="t">번역 변경 감지 스케줄러</text><text x="832" y="388" class="was">한 실행 100~224초</text><text x="832" y="410" class="s">↓</text><text x="832" y="446" class="v">실행당 상한 500건</text><path d="M832 474h304" stroke="#cfd8d2" stroke-width="1.5"/><text x="832" y="506" class="b">버전별 쿼리 + 페이지네이션</text><text x="832" y="534" class="b">live EXPLAIN 버전 1개 39ms(일괄 10.1초)</text><text x="40" y="626" class="s">공개용 재구성 · 내부 테이블·메서드명은 일반 명칭으로 대체 · 케이스마다 환경(live/sandbox) 표기</text></svg>
