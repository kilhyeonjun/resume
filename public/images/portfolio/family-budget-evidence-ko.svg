<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">계획과 실제의 도메인 정본</title><desc id="desc">반복 규칙에서 월별 occurrence를 만들고 실제 거래 또는 목적통장 입금을 연결해 예상 실제 차이를 계산한다.</desc><defs><style>.title{font:700 32px system-ui,sans-serif;fill:#111827}.head{font:700 18px system-ui,sans-serif;fill:#111827}.body{font:500 14px system-ui,sans-serif;fill:#475569}.box{fill:#fff;stroke:#334155;stroke-width:2}.muted{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.evidence{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.arrow{stroke:#111827;stroke-width:2;fill:none;marker-end:url(#m)}.dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:7 7;marker-end:url(#m)}.note{font:700 15px system-ui,sans-serif;fill:#047857}</style><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#111827"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><text x="48" y="62" class="title">계획 · occurrence · actual 분리</text><rect x="70" y="145" width="250" height="150" rx="14" class="box"/><text x="90" y="183" class="head">반복 규칙 · 계획 정본</text><text x="90" y="215" class="body">예상 수입 · 고정지출 · 저축</text><text x="90" y="238" class="body">금액 · cadence · 기간</text><rect x="475" y="145" width="250" height="150" rx="14" class="box"/><text x="495" y="183" class="head">월별 occurrence · 조정 단위</text><text x="495" y="215" class="body">matched · variance · skipped</text><text x="495" y="238" class="body">candidate · reopen</text><rect x="880" y="95" width="250" height="130" rx="14" class="box"/><text x="900" y="133" class="head">실제 거래 · 사실 정본</text><text x="900" y="165" class="body">실수입 · 실제 지출</text><text x="900" y="188" class="body">날짜 · 결제 · 상태</text><rect x="880" y="300" width="250" height="130" rx="14" class="box"/><text x="900" y="338" class="head">목적통장 입금 · 사실 정본</text><text x="900" y="370" class="body">실제 입금 사건</text><text x="900" y="393" class="body">연결된 actual</text><rect x="475" y="410" width="250" height="105" rx="14" class="evidence"/><text x="495" y="448" class="head">대시보드 파생</text><text x="495" y="480" class="body">expected · actual · variance</text><path d="M320 220 H469" class="arrow"/><path d="M725 200 H874" class="arrow"/><path d="M725 240 H805 V365 H874" class="arrow"/><path d="M1005 225 V405 H731" class="dash"/><path d="M880 365 H805 V462 H731" class="dash"/><text x="48" y="592" class="note">계획은 실제 거래가 아니다. 규칙 변경은 이미 기록된 실제 사실을 덮어쓰지 않습니다.</text></svg>