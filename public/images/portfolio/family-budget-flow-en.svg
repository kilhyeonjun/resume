<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Family Budget reconciliation flow</title><desc id="desc">A monthly occurrence looks for an existing actual first, then links or creates only after confirmation, followed by a transactional write, read-back, and dashboard update.</desc><defs><style>.title{font:700 32px system-ui,sans-serif;fill:#111827}.head{font:700 18px system-ui,sans-serif;fill:#111827}.body{font:500 14px system-ui,sans-serif;fill:#475569}.box{fill:#fff;stroke:#334155;stroke-width:2}.muted{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.evidence{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.arrow{stroke:#111827;stroke-width:2;fill:none;marker-end:url(#m)}.dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:7 7;marker-end:url(#m)}.note{font:700 15px system-ui,sans-serif;fill:#047857}</style><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#111827"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><text x="48" y="62" class="title">Representative reconciliation flow</text><rect x="48" y="120" width="190" height="130" rx="14" class="box"/><text x="68" y="158" class="head">1. Find occurrence</text><text x="68" y="190" class="body">Rule · owner · month</text><text x="68" y="213" class="body">Current state</text><rect x="278" y="120" width="190" height="130" rx="14" class="box"/><text x="298" y="158" class="head">2. Find candidates</text><text x="298" y="190" class="body">Existing actual first</text><text x="298" y="213" class="body">Duplicate risk</text><rect x="508" y="120" width="190" height="130" rx="14" class="box"/><text x="528" y="158" class="head">3. Confirm</text><text x="528" y="190" class="body">Link / create</text><text x="528" y="213" class="body">Or skip</text><rect x="738" y="120" width="190" height="130" rx="14" class="box"/><text x="758" y="158" class="head">4. Safe write</text><text x="758" y="190" class="body">Transaction · audit</text><text x="758" y="213" class="body">Idempotent occurrence</text><rect x="968" y="120" width="184" height="130" rx="14" class="box"/><text x="988" y="158" class="head">5. Read back</text><text x="988" y="190" class="body">Ledger · dashboard</text><text x="988" y="213" class="body">Expected/actual/variance</text><rect x="278" y="355" width="190" height="110" rx="14" class="muted"/><text x="298" y="393" class="head">No candidate</text><text x="298" y="425" class="body">Explicit new actual</text><rect x="738" y="355" width="190" height="110" rx="14" class="muted"/><text x="758" y="393" class="head">Conflict / partial</text><text x="758" y="425" class="body">Re-read truth</text><text x="758" y="448" class="body">No blind retry</text><rect x="968" y="355" width="184" height="110" rx="14" class="muted"/><text x="988" y="393" class="head">Reopen</text><text x="988" y="425" class="body">Unlink safely</text><text x="988" y="448" class="body">Reconcile again</text><path d="M238 185 H272" class="arrow"/><path d="M468 185 H502" class="arrow"/><path d="M698 185 H732" class="arrow"/><path d="M928 185 H962" class="arrow"/><path d="M373 250 V349" class="dash"/><path d="M833 250 V349" class="dash"/><path d="M1060 250 V349" class="dash"/><text x="48" y="592" class="note">A plan is not an actual transaction. When a candidate exists, confirm linking before creation.</text></svg>