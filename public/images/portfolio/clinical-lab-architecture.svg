<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"><title>Clinical-lab job decision pipeline</title><desc>Multiple job sources are normalized while public discovery and account-scoped state remain separate.</desc><style>.h{font:700 34px system-ui;fill:#f8fafc}.s{font:500 17px system-ui;fill:#94a3b8}.k{font:700 12px monospace;letter-spacing:2px}.t{font:700 23px system-ui;fill:#f8fafc}.b{font:500 16px system-ui;fill:#cbd5e1}</style><rect width="1200" height="630" rx="24" fill="#020617"/><text x="54" y="68" class="h">임상병리 채용 의사결정 파이프라인</text><text x="54" y="102" class="s">Normalize multiple sources; separate public discovery from account-scoped state.</text><g transform="translate(54 165)"><rect width="310" height="300" rx="18" fill="#111827" stroke="#94a3b8" stroke-width="2"/><text x="24" y="38" class="k" fill="#94a3b8">SOURCES</text><text x="24" y="78" class="t">채용 원천 adapters</text><text x="24" y="120" class="b">HTML / API collection</text><text x="24" y="150" class="b">deadline · region · employment</text></g><g transform="translate(445 165)"><rect width="310" height="300" rx="18" fill="#111827" stroke="#a78bfa" stroke-width="2"/><text x="24" y="38" class="k" fill="#a78bfa">READ MODEL</text><text x="24" y="78" class="t">검증된 공고 저장</text><text x="24" y="120" class="b">deduplicating upsert</text><text x="24" y="150" class="b">open state · freshness</text><text x="24" y="180" class="b">account-scoped tracker</text></g><g transform="translate(836 165)"><rect width="310" height="300" rx="18" fill="#111827" stroke="#22d3ee" stroke-width="2"/><text x="24" y="38" class="k" fill="#22d3ee">DECISION UI</text><text x="24" y="78" class="t">모바일 우선 탐색</text><text x="24" y="120" class="b">official source first</text><text x="24" y="150" class="b">deadline / region filters</text><text x="24" y="180" class="b">interest / application state</text></g><text x="54" y="586" class="s">Synthetic evidence only · real applications and operating URLs excluded</text></svg>