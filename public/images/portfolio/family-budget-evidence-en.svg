<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 650" role="img" aria-labelledby="title desc"><title id="title">Synthetic UI evidence board</title><desc id="desc">Six-step flow through representative entry, read-back, and reset across seven screens</desc><defs><style>.t{font:700 22px system-ui,sans-serif;fill:#111827}.h{font:700 14px system-ui,sans-serif;fill:#111827}.b{font:500 12px system-ui,sans-serif;fill:#475569}.box{fill:#fff;stroke:#334155;stroke-width:2}.arrow{stroke:#111827;stroke-width:2;fill:none;marker-end:url(#m)}.note{font:700 12px system-ui,sans-serif;fill:#047857}</style><marker id="m" markerWidth="7" markerHeight="7" refX="6" refY="2" orient="auto"><path d="M0,0 L0,4 L7,2 z" fill="#111827"/></marker></defs><rect width="390" height="650" fill="#f8fafc"/><text x="18" y="48" class="t">Synthetic UI evidence board</text><rect x="18" y="100" width="166" height="122" rx="13" class="box"/><text x="32" y="138" class="h">1 · Today</text><text x="32" y="172" class="b">synthetic entry</text><rect x="206" y="100" width="166" height="122" rx="13" class="box"/><text x="220" y="138" class="h">2 · Save</text><text x="220" y="172" class="b">localStorage</text><rect x="18" y="275" width="166" height="122" rx="13" class="box"/><text x="32" y="313" class="h">3 · Dashboard</text><text x="32" y="347" class="b">monthly aggregate</text><rect x="206" y="275" width="166" height="122" rx="13" class="box"/><text x="220" y="313" class="h">4 · Ledger</text><text x="220" y="347" class="b">same transaction</text><rect x="18" y="450" width="166" height="122" rx="13" class="box"/><text x="32" y="488" class="h">5 · Disclosure</text><text x="32" y="522" class="b">synthetic data</text><rect x="206" y="450" width="166" height="122" rx="13" class="box"/><text x="220" y="488" class="h">6 · Reset</text><text x="220" y="522" class="b">restore seed</text><path d="M184 161 H202" class="arrow"/><path d="M289 222 V269" class="arrow"/><path d="M184 336 H202" class="arrow"/><path d="M289 397 V444" class="arrow"/><path d="M184 511 H202" class="arrow"/><text x="18" y="625" class="note">Six-step flow through representative entry, read-back, and reset across seven screens</text></svg>