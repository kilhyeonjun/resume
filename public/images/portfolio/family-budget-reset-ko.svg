<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">사용자별 흐름과 공개 증거</title><desc id="desc">비개발 가족 구성원의 모바일 빠른 입력과 검토 사용자의 데스크톱 조정 흐름을 나누고 공개 데모는 별도 증거로 둔다.</desc><defs><style>.title{font:700 32px system-ui,sans-serif;fill:#111827}.head{font:700 18px system-ui,sans-serif;fill:#111827}.body{font:500 14px system-ui,sans-serif;fill:#475569}.box{fill:#fff;stroke:#334155;stroke-width:2}.muted{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.evidence{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.arrow{stroke:#111827;stroke-width:2;fill:none;marker-end:url(#m)}.dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:7 7;marker-end:url(#m)}.note{font:700 15px system-ui,sans-serif;fill:#047857}</style><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#111827"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><text x="48" y="62" class="title">두 사용자 흐름, 하나의 운영 원장</text><rect x="60" y="125" width="260" height="145" rx="14" class="box"/><text x="80" y="163" class="head">모바일 빠른 입력</text><text x="80" y="195" class="body">비개발 가족 구성원</text><text x="80" y="218" class="body">필수 필드 중심 · 즉시 확인</text><rect x="470" y="125" width="260" height="145" rx="14" class="box"/><text x="490" y="163" class="head">운영 원장</text><text x="490" y="195" class="body">동일한 검증·권한</text><text x="490" y="218" class="body">거래 · 목적통장 · 자산</text><rect x="880" y="125" width="260" height="145" rx="14" class="box"/><text x="900" y="163" class="head">데스크톱 검토</text><text x="900" y="195" class="body">DataGrid · 필터 · 월 마감</text><text x="900" y="218" class="body">occurrence 조정 · variance</text><rect x="260" y="370" width="280" height="120" rx="14" class="evidence"/><text x="280" y="408" class="head">Canonical UI package</text><text x="280" y="440" class="body">운영 제품의 공개 화면 계약</text><text x="280" y="463" class="body">고정 SHA · manifest</text><rect x="660" y="370" width="280" height="120" rx="14" class="evidence"/><text x="680" y="408" class="head">합성 공개 데모</text><text x="680" y="440" class="body">seed · browser localStorage</text><text x="680" y="463" class="body">운영 백엔드의 대체 아님</text><path d="M320 198 H464" class="arrow"/><path d="M730 198 H874" class="arrow"/><path d="M600 270 V330 H400 V364" class="dash"/><path d="M540 430 H654" class="arrow"/><text x="48" y="592" class="note">공개 데모는 제품 경험과 공개 경계를 보여주는 보조 증거이며 운영 아키텍처의 주체가 아닙니다.</text></svg>