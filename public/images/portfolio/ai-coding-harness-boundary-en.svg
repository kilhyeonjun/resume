<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" role="img" aria-labelledby="title desc">
  <title id="title">Profile boundaries and evidence verification</title><desc id="desc">A developer selects one isolated Personal, Work, or Platform runtime, retrieves evidence candidates, verifies original sources, and passes execution gates.</desc>
  <style>.t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1d4ed8;font-weight:700}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.flow{stroke:#1d4ed8;stroke-width:4;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1d4ed8"/></marker></defs>
  <rect width="720" height="620" rx="24" fill="#f8fafc"/>
  <text x="40" y="55" class="m" font-size="28">01 · SELECT RUNTIME</text>
  <rect x="40" y="85" width="190" height="110" rx="16" class="box"/><rect x="265" y="85" width="190" height="110" rx="16" class="box"/><rect x="490" y="85" width="190" height="110" rx="16" class="box"/>
  <text x="135" y="135" text-anchor="middle" class="t" font-size="28" font-weight="700">Personal</text><text x="135" y="170" text-anchor="middle" class="t" font-size="22">Own tools · rules</text>
  <text x="360" y="135" text-anchor="middle" class="t" font-size="28" font-weight="700">Work</text><text x="360" y="170" text-anchor="middle" class="t" font-size="22">Own tools · rules</text>
  <text x="585" y="135" text-anchor="middle" class="t" font-size="28" font-weight="700">Platform</text><text x="585" y="170" text-anchor="middle" class="t" font-size="22">Own tools · rules</text>
  <path d="M360 210 V255" class="flow"/><rect x="90" y="270" width="540" height="95" rx="16" class="box"/>
  <text x="360" y="310" text-anchor="middle" class="m" font-size="26">02 · FIND CANDIDATES</text><text x="360" y="342" text-anchor="middle" class="t" font-size="24">RAG retrieval · KG relationships</text>
  <path d="M360 375 V420" class="flow"/><rect x="90" y="435" width="540" height="95" rx="16" class="box"/>
  <text x="360" y="475" text-anchor="middle" class="m" font-size="26">03 · VERIFY SOURCE</text><text x="360" y="507" text-anchor="middle" class="t" font-size="24">Check candidates against originals</text>
  <path d="M360 540 V575" class="flow"/><text x="360" y="605" text-anchor="middle" class="t" font-size="26" font-weight="700">Execute only after gates pass</text>
</svg>
