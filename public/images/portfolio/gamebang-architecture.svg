<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"><title>Gamebang server-authoritative architecture</title><desc>Mobile clients send requests while a room Durable Object owns state, rules, and per-player projections.</desc><style>.h{font:700 34px system-ui;fill:#f8fafc}.s{font:500 17px system-ui;fill:#94a3b8}.k{font:700 12px monospace;letter-spacing:2px}.t{font:700 23px system-ui;fill:#f8fafc}.b{font:500 16px system-ui;fill:#cbd5e1}</style><rect width="1200" height="630" rx="24" fill="#020617"/><text x="54" y="68" class="h">Gamebang 서버 권위형 게임 흐름</text><text x="54" y="102" class="s">Client input is a request; the server owns state, hidden information, and rulings.</text><g transform="translate(54 165)"><rect width="310" height="300" rx="18" fill="#111827" stroke="#22d3ee" stroke-width="2"/><text x="24" y="38" class="k" fill="#22d3ee">MOBILE WEB</text><text x="24" y="78" class="t">방 코드 클라이언트</text><text x="24" y="120" class="b">action request · reconnect</text><text x="24" y="150" class="b">spectate · chat</text></g><g transform="translate(445 165)"><rect width="310" height="300" rx="18" fill="#111827" stroke="#34d399" stroke-width="2"/><text x="24" y="38" class="k" fill="#34d399">ROOM DO</text><text x="24" y="78" class="t">방별 상태 정본</text><text x="24" y="120" class="b">phase · turn validation</text><text x="24" y="150" class="b">per-game state machine</text><text x="24" y="180" class="b">reconnect ownership</text></g><g transform="translate(836 165)"><rect width="310" height="300" rx="18" fill="#111827" stroke="#a78bfa" stroke-width="2"/><text x="24" y="38" class="k" fill="#a78bfa">PLAYER VIEW</text><text x="24" y="78" class="t">허용 정보만 투영</text><text x="24" y="120" class="b">own hand + public state</text><text x="24" y="150" class="b">other hidden data excluded</text></g><text x="54" y="586" class="s">Private repository · public live surface · no participant data in portfolio evidence</text></svg>