<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 650" role="img" aria-labelledby="title desc"><title id="title">브라우저 로컬 저장과 초기화 경계</title><desc id="desc">현재 브라우저에만 유지되며 reset은 추적된 seed를 복원</desc><defs><style>.t{font:700 22px system-ui,sans-serif;fill:#111827}.h{font:700 14px system-ui,sans-serif;fill:#111827}.b{font:500 12px system-ui,sans-serif;fill:#475569}.box{fill:#fff;stroke:#334155;stroke-width:2}.arrow{stroke:#111827;stroke-width:2;fill:none;marker-end:url(#m)}.note{font:700 12px system-ui,sans-serif;fill:#047857}</style><marker id="m" markerWidth="7" markerHeight="7" refX="6" refY="2" orient="auto"><path d="M0,0 L0,4 L7,2 z" fill="#111827"/></marker></defs><rect width="390" height="650" fill="#f8fafc"/><text x="18" y="48" class="t">브라우저 로컬 저장과 초기화 경계</text><rect x="18" y="100" width="166" height="122" rx="13" class="box"/><text x="32" y="138" class="h">입력</text><text x="32" y="172" class="b">합성 변경</text><rect x="206" y="100" width="166" height="122" rx="13" class="box"/><text x="220" y="138" class="h">저장</text><text x="220" y="172" class="b">localStorage</text><rect x="18" y="275" width="166" height="122" rx="13" class="box"/><text x="32" y="313" class="h">새로고침</text><text x="32" y="347" class="b">같은 브라우저</text><rect x="206" y="275" width="166" height="122" rx="13" class="box"/><text x="220" y="313" class="h">조회</text><text x="220" y="347" class="b">변경 유지</text><rect x="18" y="450" width="166" height="122" rx="13" class="box"/><text x="32" y="488" class="h">Reset</text><text x="32" y="522" class="b">로컬 상태 삭제</text><rect x="206" y="450" width="166" height="122" rx="13" class="box"/><text x="220" y="488" class="h">복원</text><text x="220" y="522" class="b">tracked seed</text><path d="M184 161 H202" class="arrow"/><path d="M289 222 V269" class="arrow"/><path d="M184 336 H202" class="arrow"/><path d="M289 397 V444" class="arrow"/><path d="M184 511 H202" class="arrow"/><text x="18" y="625" class="note">현재 브라우저에만 유지되며 reset은 추적된 seed를 복원</text></svg>