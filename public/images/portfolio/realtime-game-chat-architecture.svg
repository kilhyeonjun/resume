<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img"><title>Multi-tenant game chat write path</title><desc>Game clients connect to a TCP gateway that appends ordering, dedupe, and WAL state atomically to a four-shard Valkey cluster before acknowledging. Each channel is routed by a stable hash of its channel ID so the WAL stream and channel state share one hash tag. A separate WAL writer consumes the stream and persists message segments to DynamoDB. Figures come from sandbox and dev load tests, not live traffic.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#66736c"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#17211c}.h{font-size:24px;font-weight:800}.s{font-size:14px;fill:#66736c}.k{font-size:11px;font-weight:800;letter-spacing:2px;fill:#66736c}.t{font-size:19px;font-weight:800}.b{font-size:14px;fill:#3d4a43}.m{font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#3d4a43}.v{font-size:16px;font-weight:800;fill:#0f5132}.box{fill:#fffdfa;stroke:#cfd8d2;stroke-width:2}.hot{fill:#eef6f0;stroke:#6aa47f;stroke-width:2}.ln{stroke:#66736c;stroke-width:2.5;fill:none}</style></defs><rect width="1200" height="600" rx="24" fill="#f7f5ef"/><text x="40" y="52" class="h">Multi-tenant game chat · write path</text><text x="40" y="80" class="s">Public redraw · figures from sandbox/dev load tests, not live traffic</text><rect x="40" y="120" width="200" height="140" rx="12" class="box"/><text x="60" y="146" class="k">CLIENTS</text><text x="60" y="176" class="t">Game clients</text><text x="60" y="202" class="b">multi-tenant · TCP</text><text x="60" y="226" class="b">AUTH · JOIN · SEND</text><path d="M240 190h36" class="ln" marker-end="url(#a)"/><rect x="284" y="120" width="230" height="140" rx="12" class="box"/><text x="304" y="146" class="k">GATEWAY</text><text x="304" y="176" class="t">Chat gateway</text><text x="304" y="202" class="b">ECS Fargate behind NLB</text><text x="304" y="226" class="b">ordering · dedupe</text><text x="304" y="248" class="b">backpressure</text><path d="M514 190h36" class="ln" marker-end="url(#a)"/><text x="402" y="292" class="s" text-anchor="middle">ACK only after atomic append</text><rect x="558" y="110" width="602" height="230" rx="14" class="hot"/><text x="578" y="138" class="k">VALKEY CLUSTER · 4 SHARDS</text><g class="m"><rect x="578" y="156" width="134" height="92" rx="10" class="box"/><text x="590" y="182" class="t" style="font-size:16px">shard 0</text><text x="590" y="206">WAL stream</text><text x="590" y="228">seq · dedupe</text><rect x="724" y="156" width="134" height="92" rx="10" class="box"/><text x="736" y="182" class="t" style="font-size:16px">shard 1</text><text x="736" y="206">WAL stream</text><text x="736" y="228">seq · dedupe</text><rect x="870" y="156" width="134" height="92" rx="10" class="box"/><text x="882" y="182" class="t" style="font-size:16px">shard 2</text><text x="882" y="206">WAL stream</text><text x="882" y="228">seq · dedupe</text><rect x="1016" y="156" width="124" height="92" rx="10" class="box"/><text x="1028" y="182" class="t" style="font-size:16px">shard 3</text><text x="1028" y="206">WAL stream</text><text x="1028" y="228">seq · dedupe</text></g><text x="578" y="280" class="m">shard = stableHash(channel id) mod 4</text><text x="578" y="304" class="b">WAL stream + channel state share one hash tag: one channel, one slot,</text><text x="578" y="326" class="b">so the multi-key append stays atomic (no CROSSSLOT).</text><path d="M760 340v56" class="ln" marker-end="url(#a)"/><rect x="620" y="404" width="260" height="110" rx="12" class="box"/><text x="640" y="430" class="k">ASYNC DURABILITY</text><text x="640" y="460" class="t">WAL writer</text><text x="640" y="486" class="b">stream consumer group</text><path d="M880 459h40" class="ln" marker-end="url(#a)"/><rect x="928" y="404" width="232" height="110" rx="12" class="box"/><text x="948" y="430" class="k">STORE</text><text x="948" y="460" class="t">DynamoDB</text><text x="948" y="486" class="b">message segments</text><rect x="40" y="330" width="474" height="230" rx="12" class="box"/><text x="60" y="358" class="k">MEASURED · SANDBOX / DEV</text><text x="60" y="394" class="b">ACK p95 @ 6K msg/s · 1 → 4 shards</text><text x="494" y="394" class="v" text-anchor="end">767.6ms → 6.6ms</text><text x="60" y="430" class="b">Accept rate</text><text x="494" y="430" class="v" text-anchor="end">99.39% → 99.994%</text><text x="60" y="466" class="b">Hottest shard EngineCPU</text><text x="494" y="466" class="v" text-anchor="end">99.9% → 74.7%</text><text x="60" y="502" class="b">Dev load test, held 900s</text><text x="494" y="502" class="v" text-anchor="end">20,002 CCU</text><text x="60" y="538" class="s">Separate dev run: online cache scale-up, 0 lost connections</text></svg>
