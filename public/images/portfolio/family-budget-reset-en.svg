<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">User-specific flows and public evidence</title><desc id="desc">The non-developer household member gets mobile quick entry, the review user gets desktop reconciliation, and the public demo remains a separate evidence surface.</desc><defs><style>.title{font:700 32px system-ui,sans-serif;fill:#111827}.head{font:700 18px system-ui,sans-serif;fill:#111827}.body{font:500 14px system-ui,sans-serif;fill:#475569}.box{fill:#fff;stroke:#334155;stroke-width:2}.muted{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.evidence{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.arrow{stroke:#111827;stroke-width:2;fill:none;marker-end:url(#m)}.dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:7 7;marker-end:url(#m)}.note{font:700 15px system-ui,sans-serif;fill:#047857}</style><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#111827"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><text x="48" y="62" class="title">Two user flows, one operational ledger</text><rect x="60" y="125" width="260" height="145" rx="14" class="box"/><text x="80" y="163" class="head">Mobile quick entry</text><text x="80" y="195" class="body">Non-developer household member</text><text x="80" y="218" class="body">Required fields · immediate result</text><rect x="470" y="125" width="260" height="145" rx="14" class="box"/><text x="490" y="163" class="head">Operational ledger</text><text x="490" y="195" class="body">Same validation · authority</text><text x="490" y="218" class="body">Transactions · purpose · assets</text><rect x="880" y="125" width="260" height="145" rx="14" class="box"/><text x="900" y="163" class="head">Desktop review</text><text x="900" y="195" class="body">DataGrid · filters · close</text><text x="900" y="218" class="body">Occurrence reconciliation</text><rect x="260" y="370" width="280" height="120" rx="14" class="evidence"/><text x="280" y="408" class="head">Canonical UI package</text><text x="280" y="440" class="body">Public screen contract</text><text x="280" y="463" class="body">Pinned SHA · manifest</text><rect x="660" y="370" width="280" height="120" rx="14" class="evidence"/><text x="680" y="408" class="head">Synthetic public demo</text><text x="680" y="440" class="body">Seed · browser localStorage</text><text x="680" y="463" class="body">Not the operating backend</text><path d="M320 198 H464" class="arrow"/><path d="M730 198 H874" class="arrow"/><path d="M600 270 V330 H400 V364" class="dash"/><path d="M540 430 H654" class="arrow"/><text x="48" y="592" class="note">The public demo is secondary evidence for product experience and disclosure boundaries, not the case-study subject.</text></svg>