<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>공통 패키지·CI 플랫폼</title><desc>공통 npm 패키지 릴리스를 GitHub Actions workflow_dispatch와 matrix로 7개 프로젝트에 업그레이드하는 흐름과 fork 정렬·업그레이드·테스트 CI 전후 수치. 내부 제품·게임명은 일반 명칭으로 대체.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#66736c"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#17211c}.h{font-size:30px;font-weight:800}.s{font-size:15px;fill:#66736c}.k{font-size:11px;font-weight:800;letter-spacing:2px;fill:#66736c}.t{font-size:18px;font-weight:800}.b{font-size:14px;fill:#3d4a43}.was{font-size:15px;fill:#8a958f}.v{font-size:26px;font-weight:800;fill:#0f5132}.box{fill:#fffdfa;stroke:#cfd8d2;stroke-width:2}.hot{fill:#eef6f0;stroke:#6aa47f;stroke-width:2}.ln{stroke:#66736c;stroke-width:2.5;fill:none}</style></defs><rect width="1200" height="675" fill="#f7f5ef"/><text x="40" y="62" class="h">공통 패키지 &amp; CI 플랫폼</text><text x="40" y="94" class="s">게임 서버 7개 프로젝트 · 브랜치 최대 12개</text><rect x="40" y="124" width="352" height="118" rx="12" class="box"/><text x="64" y="152" class="k">SOURCE</text><text x="64" y="184" class="t">공통 npm 패키지</text><text x="64" y="214" class="b">데이터 모듈 패키지</text><path d="M394 183h24" class="ln" marker-end="url(#a)"/><rect x="424" y="124" width="352" height="118" rx="12" class="box"/><text x="448" y="152" class="k">AUTOMATION</text><text x="448" y="184" class="t">GitHub Actions</text><text x="448" y="214" class="b">workflow_dispatch + matrix</text><path d="M778 183h24" class="ln" marker-end="url(#a)"/><rect x="808" y="124" width="352" height="118" rx="12" class="box"/><text x="832" y="152" class="k">TARGETS</text><text x="832" y="184" class="t">7개 프로젝트</text><text x="832" y="214" class="b">main/develop · 최대 12 브랜치</text><rect x="40" y="274" width="352" height="306" rx="14" class="hot"/><text x="64" y="306" class="k">FORK</text><text x="64" y="340" class="t">fork 정렬</text><text x="64" y="388" class="was">2년+ 어긋난 모듈 17개 fork</text><text x="64" y="410" class="s">↓</text><text x="64" y="446" class="v">npm 버전 bump</text><path d="M64 474h304" stroke="#cfd8d2" stroke-width="1.5"/><text x="64" y="506" class="b">610개 파일 · 마이그레이션 47개 삭제</text><text x="64" y="534" class="b">live 회귀 82분 만에 hotfix</text><rect x="424" y="274" width="352" height="306" rx="14" class="hot"/><text x="448" y="306" class="k">UPGRADE</text><text x="448" y="340" class="t">패키지 업그레이드</text><text x="448" y="388" class="was">수동 약 3시간</text><text x="448" y="410" class="s">↓</text><text x="448" y="446" class="v">자동 약 15분</text><path d="M448 474h304" stroke="#cfd8d2" stroke-width="1.5"/><text x="448" y="506" class="b">7개 프로젝트 matrix 병렬</text><text x="448" y="534" class="b">미적용 프로젝트는 수동 롤아웃</text><rect x="808" y="274" width="352" height="306" rx="14" class="hot"/><text x="832" y="306" class="k">TEST CI · SERVER KIT</text><text x="832" y="340" class="t">테스트 job 평균</text><text x="832" y="388" class="was">15분47초</text><text x="832" y="410" class="s">↓</text><text x="832" y="446" class="v">6분6초 · 61%</text><path d="M832 474h304" stroke="#cfd8d2" stroke-width="1.5"/><text x="832" y="506" class="b">ts-jest isolatedModules</text><text x="832" y="534" class="b">81 suites · 978 tests 통과</text><text x="40" y="626" class="s">타입 검사는 CI의 별도 tsc --noEmit 단계 · 내부 제품·게임명은 일반 명칭으로 대체</text></svg>
