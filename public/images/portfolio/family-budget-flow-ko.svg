<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Family Budget 조정 흐름</title><desc id="desc">월별 occurrence가 기존 실제 후보를 먼저 찾고 사용자 확인 뒤 연결 또는 생성하며 트랜잭션과 read-back 이후 대시보드에 반영된다.</desc><defs><style>.title{font:700 32px system-ui,sans-serif;fill:#111827}.head{font:700 18px system-ui,sans-serif;fill:#111827}.body{font:500 14px system-ui,sans-serif;fill:#475569}.box{fill:#fff;stroke:#334155;stroke-width:2}.muted{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.evidence{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.arrow{stroke:#111827;stroke-width:2;fill:none;marker-end:url(#m)}.dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:7 7;marker-end:url(#m)}.note{font:700 15px system-ui,sans-serif;fill:#047857}</style><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#111827"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><text x="48" y="62" class="title">대표 조정 흐름</text><rect x="48" y="120" width="190" height="130" rx="14" class="box"/><text x="68" y="158" class="head">1. occurrence 찾기</text><text x="68" y="190" class="body">규칙 · 소유자 · 월</text><text x="68" y="213" class="body">현재 상태 확인</text><rect x="278" y="120" width="190" height="130" rx="14" class="box"/><text x="298" y="158" class="head">2. 후보 탐색</text><text x="298" y="190" class="body">기존 actual 우선</text><text x="298" y="213" class="body">중복 가능성 확인</text><rect x="508" y="120" width="190" height="130" rx="14" class="box"/><text x="528" y="158" class="head">3. 사용자 확인</text><text x="528" y="190" class="body">연결 / 새 생성</text><text x="528" y="213" class="body">skip 선택</text><rect x="738" y="120" width="190" height="130" rx="14" class="box"/><text x="758" y="158" class="head">4. 안전한 write</text><text x="758" y="190" class="body">트랜잭션 · 감사</text><text x="758" y="213" class="body">멱등 occurrence</text><rect x="968" y="120" width="184" height="130" rx="14" class="box"/><text x="988" y="158" class="head">5. read-back</text><text x="988" y="190" class="body">원장 · 대시보드</text><text x="988" y="213" class="body">예상/실제/차이</text><rect x="278" y="355" width="190" height="110" rx="14" class="muted"/><text x="298" y="393" class="head">후보 없음</text><text x="298" y="425" class="body">명시적 새 actual</text><rect x="738" y="355" width="190" height="110" rx="14" class="muted"/><text x="758" y="393" class="head">충돌·부분 성공</text><text x="758" y="425" class="body">사실 재조회</text><text x="758" y="448" class="body">무조건 재시도 금지</text><rect x="968" y="355" width="184" height="110" rx="14" class="muted"/><text x="988" y="393" class="head">reopen</text><text x="988" y="425" class="body">연결 해제</text><text x="988" y="448" class="body">다시 조정</text><path d="M238 185 H272" class="arrow"/><path d="M468 185 H502" class="arrow"/><path d="M698 185 H732" class="arrow"/><path d="M928 185 H962" class="arrow"/><path d="M373 250 V349" class="dash"/><path d="M833 250 V349" class="dash"/><path d="M1060 250 V349" class="dash"/><text x="48" y="592" class="note">계획은 실제 거래가 아닙니다. 후보가 있으면 새로 만들기 전에 연결을 확인합니다.</text></svg>