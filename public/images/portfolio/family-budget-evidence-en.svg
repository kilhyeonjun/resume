<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Domain sources of truth for plan and actual</title><desc id="desc">A recurring rule produces a monthly occurrence that links actual transactions or purpose deposits so expected, actual, and variance remain distinct.</desc><defs><style>.title{font:700 32px system-ui,sans-serif;fill:#111827}.head{font:700 18px system-ui,sans-serif;fill:#111827}.body{font:500 14px system-ui,sans-serif;fill:#475569}.box{fill:#fff;stroke:#334155;stroke-width:2}.muted{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.evidence{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.arrow{stroke:#111827;stroke-width:2;fill:none;marker-end:url(#m)}.dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:7 7;marker-end:url(#m)}.note{font:700 15px system-ui,sans-serif;fill:#047857}</style><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#111827"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><text x="48" y="62" class="title">Separate plan · occurrence · actual</text><rect x="70" y="145" width="250" height="150" rx="14" class="box"/><text x="90" y="183" class="head">Recurring rule · plan truth</text><text x="90" y="215" class="body">Expected income · fixed spend</text><text x="90" y="238" class="body">Savings · cadence · period</text><rect x="475" y="145" width="250" height="150" rx="14" class="box"/><text x="495" y="183" class="head">Monthly occurrence</text><text x="495" y="215" class="body">Matched · variance · skipped</text><text x="495" y="238" class="body">Candidate · reopen</text><rect x="880" y="95" width="250" height="130" rx="14" class="box"/><text x="900" y="133" class="head">Transaction · fact truth</text><text x="900" y="165" class="body">Actual income · spend</text><text x="900" y="188" class="body">Date · payment · state</text><rect x="880" y="300" width="250" height="130" rx="14" class="box"/><text x="900" y="338" class="head">Purpose deposit · fact truth</text><text x="900" y="370" class="body">Actual deposit event</text><text x="900" y="393" class="body">Linked actual</text><rect x="475" y="410" width="250" height="105" rx="14" class="evidence"/><text x="495" y="448" class="head">Dashboard derives</text><text x="495" y="480" class="body">Expected · actual · variance</text><path d="M320 220 H469" class="arrow"/><path d="M725 200 H874" class="arrow"/><path d="M725 240 H805 V365 H874" class="arrow"/><path d="M1005 225 V405 H731" class="dash"/><path d="M880 365 H805 V462 H731" class="dash"/><text x="48" y="592" class="note">A plan is not an actual transaction. Rule changes do not overwrite already-recorded facts.</text></svg>