<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"><title>Clinical-lab durable notification outbox</title><desc>A notification is complete only after confirmed delivery, then the stream watermark advances.</desc><style>.h{font:700 34px system-ui;fill:#f8fafc}.s{font:500 17px system-ui;fill:#94a3b8}.k{font:700 12px monospace;letter-spacing:2px}.t{font:700 23px system-ui;fill:#f8fafc}.b{font:500 16px system-ui;fill:#cbd5e1}</style><rect width="1200" height="630" rx="24" fill="#020617"/><text x="54" y="68" class="h">전달 성공 전에는 완료로 보지 않습니다</text><text x="54" y="102" class="s">Outbox and watermark stay separate across duplicate workers and transient failures.</text><g transform="translate(54 165)"><rect width="310" height="300" rx="18" fill="#111827" stroke="#94a3b8" stroke-width="2"/><text x="24" y="38" class="k" fill="#94a3b8">ENQUEUE</text><text x="24" y="78" class="t">신규 공고 적재</text><text x="24" y="120" class="b">job-ID dedupe</text><text x="24" y="150" class="b">persist notification payload</text></g><g transform="translate(445 165)"><rect width="310" height="300" rx="18" fill="#111827" stroke="#fbbf24" stroke-width="2"/><text x="24" y="38" class="k" fill="#fbbf24">CLAIM</text><text x="24" y="78" class="t">원자적 lease</text><text x="24" y="120" class="b">block concurrent duplicate work</text><text x="24" y="150" class="b">bounded transient retry</text></g><g transform="translate(836 165)"><rect width="310" height="300" rx="18" fill="#111827" stroke="#34d399" stroke-width="2"/><text x="24" y="38" class="k" fill="#34d399">CONFIRM</text><text x="24" y="78" class="t">성공 확인 후 전진</text><text x="24" y="120" class="b">mark delivered</text><text x="24" y="150" class="b">then advance watermark</text></g><text x="54" y="586" class="s">Behavioral contract example · destination, message, and SLA remain private</text></svg>