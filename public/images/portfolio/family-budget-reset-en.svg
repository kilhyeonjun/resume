<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 650" role="img" aria-labelledby="title desc"><title id="title">Browser-local persistence and reset boundary</title><desc id="desc">State stays in the current browser, and reset restores the tracked seed</desc><defs><style>.t{font:700 22px system-ui,sans-serif;fill:#111827}.h{font:700 14px system-ui,sans-serif;fill:#111827}.b{font:500 12px system-ui,sans-serif;fill:#475569}.box{fill:#fff;stroke:#334155;stroke-width:2}.arrow{stroke:#111827;stroke-width:2;fill:none;marker-end:url(#m)}.note{font:700 12px system-ui,sans-serif;fill:#047857}</style><marker id="m" markerWidth="7" markerHeight="7" refX="6" refY="2" orient="auto"><path d="M0,0 L0,4 L7,2 z" fill="#111827"/></marker></defs><rect width="390" height="650" fill="#f8fafc"/><text x="18" y="48" class="t">Browser-local persistence and reset boundary</text><rect x="18" y="100" width="166" height="122" rx="13" class="box"/><text x="32" y="138" class="h">Entry</text><text x="32" y="172" class="b">synthetic change</text><rect x="206" y="100" width="166" height="122" rx="13" class="box"/><text x="220" y="138" class="h">Save</text><text x="220" y="172" class="b">localStorage</text><rect x="18" y="275" width="166" height="122" rx="13" class="box"/><text x="32" y="313" class="h">Refresh</text><text x="32" y="347" class="b">same browser</text><rect x="206" y="275" width="166" height="122" rx="13" class="box"/><text x="220" y="313" class="h">Read</text><text x="220" y="347" class="b">change retained</text><rect x="18" y="450" width="166" height="122" rx="13" class="box"/><text x="32" y="488" class="h">Reset</text><text x="32" y="522" class="b">clear local state</text><rect x="206" y="450" width="166" height="122" rx="13" class="box"/><text x="220" y="488" class="h">Restore</text><text x="220" y="522" class="b">tracked seed</text><path d="M184 161 H202" class="arrow"/><path d="M289 222 V269" class="arrow"/><path d="M184 336 H202" class="arrow"/><path d="M289 397 V444" clas