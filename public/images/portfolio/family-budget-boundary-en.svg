<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Family Budget operational boundary</title><desc id="desc">Household members and an approval-gated assistant reach the operational ledger through an authenticated API; the historical spreadsheet and public demo stay outside that boundary.</desc><defs><style>.title{font:700 32px system-ui,sans-serif;fill:#111827}.head{font:700 18px system-ui,sans-serif;fill:#111827}.body{font:500 14px system-ui,sans-serif;fill:#475569}.box{fill:#fff;stroke:#334155;stroke-width:2}.muted{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.evidence{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.arrow{stroke:#111827;stroke-width:2;fill:none;marker-end:url(#m)}.dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:7 7;marker-end:url(#m)}.note{font:700 15px system-ui,sans-serif;fill:#047857}</style><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#111827"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><text x="48" y="62" class="title">Operational product boundary and public evidence</text><rect x="48" y="110" width="220" height="145" rx="14" class="box"/><text x="68" y="148" class="head">Household member</text><text x="68" y="180" class="body">Mobile quick entry</text><text x="68" y="203" class="body">Desktop review</text><rect x="330" y="110" width="220" height="145" rx="14" class="box"/><text x="350" y="148" class="head">Approval-gated assistant</text><text x="350" y="180" class="body">Request preview</text><text x="350" y="203" class="body">Explicit confirmation</text><rect x="612" y="110" width="250" height="145" rx="14" class="box"/><text x="632" y="148" class="head">Authenticated API</text><text x="632" y="180" class="body">Validation · transaction</text><text x="632" y="203" class="body">Read-back</text><rect x="924" y="110" width="228" height="145" rx="14" class="box"/><text x="944" y="148" class="head">Operational ledger</text><text x="944" y="180" class="body">Rules · occurrences</text><text x="944" y="203" class="body">Actuals · variance</text><rect x="48" y="350" width="250" height="130" rx="14" class="muted"/><text x="68" y="388" class="head">Historical spreadsheet</text><text x="68" y="420" class="body">Read-only import</text><text x="68" y="443" class="body">No current writes</text><rect x="475" y="350" width="250" height="130" rx="14" class="evidence"/><text x="495" y="388" class="head">Canonical UI package</text><text x="495" y="420" class="body">Public screen contracts</text><text x="495" y="443" class="body">No operating data</text><rect x="902" y="350" width="250" height="130" rx="14" class="evidence"/><text x="922" y="388" class="head">Synthetic public demo</text><text x="922" y="420" class="body">Browser-local seed</text><text x="922" y="443" class="body">Secondary evidence</text><path d="M268 182 H324" class="arrow"/><path d="M550 182 H606" class="arrow"/><path d="M862 182 H918" class="arrow"/><path d="M173 350 V260 H1038 V261" class="dash"/><path d="M725 415 H896" class="arrow"/><text x="48" y="592" class="note">Real financial values, family identifiers, and credentials remain inside the operational boundary.</text></svg>