<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"><title>Flex infeasible target scenario</title><desc>A synthetic target exceeds remaining capacity, so the planner preserves limits and exposes the gap.</desc><style>.h{font:700 34px system-ui;fill:#f8fafc}.s{font:500 17px system-ui;fill:#94a3b8}.n{font:800 54px system-ui}.t{font:700 23px system-ui;fill:#f8fafc}.b{font:500 16px system-ui;fill:#cbd5e1}</style><rect width="1200" height="630" rx="24" fill="#020617"/><text x="54" y="68" class="h">불가능한 목표를 숨기지 않는 플래너</text><text x="54" y="102" class="s">Preserve hard limits; expose the remaining gap and reason.</text><g transform="translate(70 165)"><rect width="300" height="300" rx="20" fill="#111827" stroke="#94a3b8" stroke-width="2"/><text x="24" y="72" class="n" fill="#94a3b8">160h</text><text x="24" y="112" class="t">월 목표 / target</text><text x="24" y="160" class="b">남은 가용일 3일</text><text x="24" y="190" class="b">3 available days remain</text></g><g transform="translate(450 165)"><rect width="300" height="300" rx="20" fill="#111827" stroke="#fbbf24" stroke-width="2"/><text x="24" y="72" class="n" fill="#fbbf24">18h</text><text x="24" y="112" class="t">최대 배정 / capacity</text><text x="24" y="160" class="b">일·주 상한 유지</text><text x="24" y="190" class="b">daily / weekly caps preserved</text></g><g transform="translate(830 165)"><rect width="300" height="300" rx="20" fill="#111827" stroke="#fb7185" stroke-width="2"/><text x="24" y="72" class="n" fill="#fb7185">6h</text><text x="24" y="112" class="t">부족 / gap</text><text x="24" y="160" class="b">insufficient_slots</text><text x="24" y="190" class="b">조정 가능한 선택지 표시</text></g><text x="54" y="586" class="s">Synthetic scenario · 실제 근무기록 아님 / not a real work record</text></svg>