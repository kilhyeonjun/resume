<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>Shared package and CI platform</title><desc>Shared npm package releases upgraded across 7 projects with GitHub Actions workflow_dispatch and a matrix, with before and after figures for fork realignment, upgrades, and test CI. Internal product and game names are replaced.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#66736c"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#17211c}.h{font-size:30px;font-weight:800}.s{font-size:15px;fill:#66736c}.k{font-size:11px;font-weight:800;letter-spacing:2px;fill:#66736c}.t{font-size:18px;font-weight:800}.b{font-size:14px;fill:#3d4a43}.was{font-size:15px;fill:#8a958f}.v{font-size:26px;font-weight:800;fill:#0f5132}.box{fill:#fffdfa;stroke:#cfd8d2;stroke-width:2}.hot{fill:#eef6f0;stroke:#6aa47f;stroke-width:2}.ln{stroke:#66736c;stroke-width:2.5;fill:none}</style></defs><rect width="1200" height="675" fill="#f7f5ef"/><text x="40" y="62" class="h">Shared package &amp; CI platform</text><text x="40" y="94" class="s">7 game-server projects · up to 12 branches</text><rect x="40" y="124" width="352" height="118" rx="12" class="box"/><text x="64" y="152" class="k">SOURCE</text><text x="64" y="184" class="t">Shared npm package</text><text x="64" y="214" class="b">data-module package</text><path d="M394 183h24" class="ln" marker-end="url(#a)"/><rect x="424" y="124" width="352" height="118" rx="12" class="box"/><text x="448" y="152" class="k">AUTOMATION</text><text x="448" y="184" class="t">GitHub Actions</text><text x="448" y="214" class="b">workflow_dispatch + matrix</text><path d="M778 183h24" class="ln" marker-end="url(#a)"/><rect x="808" y="124" width="352" height="118" rx="12" class="box"/><text x="832" y="152" class="k">TARGETS</text><text x="832" y="184" class="t">7 projects</text><text x="832" y="214" class="b">main/develop · up to 12 branches</text><rect x="40" y="274" width="352" height="306" rx="14" class="hot"/><text x="64" y="306" class="k">FORK</text><text x="64" y="340" class="t">Fork realignment</text><text x="64" y="388" class="was">17-module fork, 2+ yrs drift</text><text x="64" y="410" class="s">↓</text><text x="64" y="446" class="v">npm version bump</text><path d="M64 474h304" stroke="#cfd8d2" stroke-width="1.5"/><text x="64" y="506" class="b">610 files, 47 migrations deleted</text><text x="64" y="534" class="b">Live regression: hotfix in 82 min</text><rect x="424" y="274" width="352" height="306" rx="14" class="hot"/><text x="448" y="306" class="k">UPGRADE</text><text x="448" y="340" class="t">Package upgrade</text><text x="448" y="388" class="was">About 3h by hand</text><text x="448" y="410" class="s">↓</text><text x="448" y="446" class="v">About 15 min</text><path d="M448 474h304" stroke="#cfd8d2" stroke-width="1.5"/><text x="448" y="506" class="b">Automated 7-project matrix</text><text x="448" y="534" class="b">Manual rollout where not adopted</text><rect x="808" y="274" width="352" height="306" rx="14" class="hot"/><text x="832" y="306" class="k">TEST CI · SERVER KIT</text><text x="832" y="340" class="t">Average test job</text><text x="832" y="388" class="was">15m47s</text><text x="832" y="410" class="s">↓</text><text x="832" y="446" class="v">6m06s · 61%</text><path d="M832 474h304" stroke="#cfd8d2" stroke-width="1.5"/><text x="832" y="506" class="b">ts-jest isolatedModules</text><text x="832" y="534" class="b">81 suites / 978 tests passing</text><text x="40" y="626" class="s">Type checks run in a separate tsc --noEmit CI step · internal product and game names replaced</text></svg>
