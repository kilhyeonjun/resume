<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>Database saturation RCA, three cases</title><desc>Three MySQL (RDS) saturation cases narrowed to the offending query with instrumentation, fixed in query shape, index, or unit of work, then guarded against regression, with before and after figures per case. Internal table and method names are replaced.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#66736c"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#17211c}.h{font-size:30px;font-weight:800}.s{font-size:15px;fill:#66736c}.k{font-size:11px;font-weight:800;letter-spacing:2px;fill:#66736c}.t{font-size:18px;font-weight:800}.b{font-size:14px;fill:#3d4a43}.was{font-size:15px;fill:#8a958f}.v{font-size:26px;font-weight:800;fill:#0f5132}.box{fill:#fffdfa;stroke:#cfd8d2;stroke-width:2}.hot{fill:#eef6f0;stroke:#6aa47f;stroke-width:2}.ln{stroke:#66736c;stroke-width:2.5;fill:none}</style></defs><rect width="1200" height="675" fill="#f7f5ef"/><text x="40" y="62" class="h">Database saturation RCA · 3 cases</text><text x="40" y="94" class="s">MySQL (RDS) · narrowed with instrumentation, fixed in queries and indexes</text><rect x="40" y="124" width="352" height="118" rx="12" class="box"/><text x="64" y="152" class="k">1 · MEASURE</text><text x="64" y="184" class="t">Instrument first</text><text x="64" y="214" class="b">Performance Insights · EXPLAIN</text><path d="M394 183h24" class="ln" marker-end="url(#a)"/><rect x="424" y="124" width="352" height="118" rx="12" class="box"/><text x="448" y="152" class="k">2 · FIX</text><text x="448" y="184" class="t">Fix the query shape</text><text x="448" y="214" class="b">query · index · unit of work</text><path d="M778 183h24" class="ln" marker-end="url(#a)"/><rect x="808" y="124" width="352" height="118" rx="12" class="box"/><text x="832" y="152" class="k">3 · GUARD</text><text x="832" y="184" class="t">Close the path back</text><text x="832" y="214" class="b">real-DDL test · per-run cap</text><rect x="40" y="274" width="352" height="306" rx="14" class="hot"/><text x="64" y="306" class="k">BACKFILL · LIVE · 15,333 ITEMS</text><text x="64" y="340" class="t">Archive backfill throughput</text><text x="64" y="388" class="was">9.3 items/min</text><text x="64" y="410" class="s">↓</text><text x="64" y="446" class="v">247/min · 26x</text><path d="M64 474h304" stroke="#cfd8d2" stroke-width="1.5"/><text x="64" y="506" class="b">Lambda p50 63.2s → 1.36s</text><text x="64" y="534" class="b">N+1 → one IN() batch</text><rect x="424" y="274" width="352" height="306" rx="14" class="hot"/><text x="448" y="306" class="k">LIVE</text><text x="448" y="340" class="t">Audit log · 26.37M rows</text><text x="448" y="388" class="was">Full scans up to 36 min</text><text x="448" y="410" class="s">↓</text><text x="448" y="446" class="v">EXPLAIN rows = 3</text><path d="M448 474h304" stroke="#cfd8d2" stroke-width="1.5"/><text x="448" y="506" class="b">Missing index restored</text><text x="448" y="534" class="b">Real-DDL integration test added</text><rect x="808" y="274" width="352" height="306" rx="14" class="hot"/><text x="832" y="306" class="k">SANDBOX</text><text x="832" y="340" class="t">Translation-change scheduler</text><text x="832" y="388" class="was">Runs of 100–224s</text><text x="832" y="410" class="s">↓</text><text x="832" y="446" class="v">500 cap per run</text><path d="M832 474h304" stroke="#cfd8d2" stroke-width="1.5"/><text x="832" y="506" class="b">Per-version queries + pagination</text><text x="832" y="534" class="b">Live EXPLAIN 39ms/version (bundled 10.1s)</text><text x="40" y="626" class="s">Public redraw · internal table and method names replaced · each case names its environment</text></svg>
