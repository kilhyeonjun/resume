<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"><title>Flex constraint planning boundary</title><desc>Synthetic input flows through a deterministic allocator into a read-only local planning interface.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#64748b"/></marker><style>.h{font:700 34px system-ui;fill:#f8fafc}.s{font:500 17px system-ui;fill:#94a3b8}.k{font:700 12px monospace;letter-spacing:2px}.t{font:700 23px system-ui;fill:#f8fafc}.b{font:500 16px system-ui;fill:#cbd5e1}</style></defs><rect width="1200" height="630" rx="24" fill="#020617"/><circle cx="54" cy="55" r="7" fill="#34d399"/><text x="78" y="66" class="h">Flex constraint planning boundary</text><text x="54" y="101" class="s">Synthetic-only evidence · no external HR-system writes</text><path d="M364 315h74" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><path d="M755 315h74" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><g transform="translate(54 160)"><rect width="310" height="300" rx="18" fill="#111827" stroke="#94a3b8" stroke-width="2"/><text x="24" y="36" class="k" fill="#94a3b8">INPUT</text><text x="24" y="74" class="t">Normalized month</text><text x="24" y="116" class="b">recognized load · actual work</text><text x="24" y="145" class="b">leave · availability</text><text x="24" y="174" class="b">daily / weekly caps</text></g><g transform="translate(445 160)"><rect width="310" height="300" rx="18" fill="#111827" stroke="#34d399" stroke-width="2"/><text x="24" y="36" class="k" fill="#34d399">PLANNER</text><text x="24" y="74" class="t">Deterministic allocator</text><text x="24" y="116" class="b">fixed plans first</text><text x="24" y="145" class="b">selective minimum activation</text><text x="24" y="174" class="b">explicit infeasibility gap</text></g><g transform="translate(836 160)"><rect width="310" height="300" rx="18" fill="#111827" stroke="#22d3ee" stroke-width="2"/><text x="24" y="36" class="k" fill="#22d3ee">LOCAL UI</text><text x="24" y="74" class="t">Decision surface</text><text x="24" y="116" class="b">Today · Plan · Calendar</text><text x="24" y="145" class="b">Analysis · History</text><text x="24" y="174" class="b">preview → local save → reset</text></g><text x="54" y="586" class="s">Candidate evidence: default-branch SHA + Python/browser CI + deterministic fixtures</text></svg>