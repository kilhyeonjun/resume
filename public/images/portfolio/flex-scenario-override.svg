<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"><title>Flex local date override scenario</title><desc>A fixed date is previewed, then only remaining dates are redistributed and stored locally.</desc><style>.h{font:700 34px system-ui;fill:#f8fafc}.s{font:500 17px system-ui;fill:#94a3b8}.k{font:700 12px monospace;letter-spacing:2px}.t{font:700 23px system-ui;fill:#f8fafc}.b{font:500 16px system-ui;fill:#cbd5e1}</style><rect width="1200" height="630" rx="24" fill="#020617"/><text x="54" y="68" class="h">날짜 고정 후 나머지만 재배분</text><text x="54" y="102" class="s">Lock one date, preview conflicts, redistribute the remainder locally.</text><g transform="translate(54 165)"><rect width="310" height="300" rx="18" fill="#111827" stroke="#94a3b8" stroke-width="2"/><text x="24" y="38" class="k" fill="#94a3b8">BEFORE</text><text x="24" y="78" class="t">수요일 8시간 고정</text><text x="24" y="116" class="b">Wednesday fixed at 8h</text><text x="24" y="160" class="b">확정 전 상태 변경 없음</text></g><g transform="translate(445 165)"><rect width="310" height="300" rx="18" fill="#111827" stroke="#fbbf24" stroke-width="2"/><text x="24" y="38" class="k" fill="#fbbf24">PREVIEW</text><text x="24" y="78" class="t">충돌·초과 확인</text><text x="24" y="116" class="b">fixed plan first</text><text x="24" y="160" class="b">remaining dates recalculated</text></g><g transform="translate(836 165)"><rect width="310" height="300" rx="18" fill="#111827" stroke="#34d399" stroke-width="2"/><text x="24" y="38" class="k" fill="#34d399">AFTER</text><text x="24" y="78" class="t">로컬 일정 저장</text><text x="24" y="116" class="b">target and caps revalidated</text><text x="24" y="160" class="b">no external system write</text></g><text x="54" y="586" class="s">Synthetic scenario · preview → local save → reset</text></svg>