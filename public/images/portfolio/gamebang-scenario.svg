<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"><title>Gamebang reconnect scenario</title><desc>The room remains authoritative through a disconnect and sends the allowed player view after reconnect.</desc><style>.h{font:700 34px system-ui;fill:#f8fafc}.s{font:500 17px system-ui;fill:#94a3b8}.n{font:800 44px system-ui}.t{font:700 23px system-ui;fill:#f8fafc}.b{font:500 16px system-ui;fill:#cbd5e1}</style><rect width="1200" height="630" rx="24" fill="#020617"/><text x="54" y="68" class="h">끊겨도 판정 정본은 서버에 남습니다</text><text x="54" y="102" class="s">Reconnect restores an allowed view; it does not recompute rules on the client.</text><g transform="translate(54 165)"><rect width="310" height="300" rx="18" fill="#111827" stroke="#22d3ee" stroke-width="2"/><text x="24" y="70" class="n" fill="#22d3ee">01</text><text x="24" y="112" class="t">행동 요청</text><text x="24" y="155" class="b">server validates phase, turn, rule</text></g><g transform="translate(445 165)"><rect width="310" height="300" rx="18" fill="#111827" stroke="#fb923c" stroke-width="2"/><text x="24" y="70" class="n" fill="#fb923c">02</text><text x="24" y="112" class="t">연결 끊김</text><text x="24" y="155" class="b">Room state remains authoritative</text></g><g transform="translate(836 165)"><rect width="310" height="300" rx="18" fill="#111827" stroke="#34d399" stroke-width="2"/><text x="24" y="70" class="n" fill="#34d399">03</text><text x="24" y="112" class="t">상태 재투영</text><text x="24" y="155" class="b">allowed personal view is resent</text></g><text x="54" y="586" class="s">Synthetic sequence · no real room code, nickname, or stats</text></svg>