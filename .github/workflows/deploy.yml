name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the generated artifact to GitHub Pages
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Type Check
        run: npm run check

      - name: Generate and verify diagrams
        run: |
          node scripts/diagram-source-contract.mjs verify
          npm run diagrams
          first_hashes="$(sha256sum public/images/portfolio/ai-coding-harness-*.svg)"
          npm run diagrams
          second_hashes="$(sha256sum public/images/portfolio/ai-coding-harness-*.svg)"
          test "$first_hashes" = "$second_hashes"
          git restore -- public/images/portfolio/ai-coding-harness-*.svg

      - name: Build with Astro
        run: npm run build

      - name: Test generated release contracts
        run: npm test

      - name: Install Korean fonts for PDF generation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk > /dev/null 2>&1

      - name: Generate release PDFs and OG
        run: |
          ./node_modules/.bin/astro dev --host 127.0.0.1 --port 4321 > /tmp/resume-dev.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4321/ > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/resume-dev.log
            exit 1
          fi
          if ! kill -0 "$server_pid" 2>/dev/null; then
            cat /tmp/resume-dev.log
            exit 1
          fi
          npm run pdf

      - name: Upload artifact
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    permissions:
      pages: write
      id-token: write
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
