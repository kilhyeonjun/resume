<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>AI coding agent platform</title><desc>How the device policy guard and the usage collection server fit together, with the count of enforcing devices and before and after figures for the collection-server outages. 87 counts reporting devices, not people; internal service names, hosts, and policy rule details are left out.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#66736c"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;fill:#17211c}.h{font-size:30px;font-weight:800}.s{font-size:15px;fill:#66736c}.k{font-size:11px;font-weight:800;letter-spacing:2px;fill:#66736c}.t{font-size:18px;font-weight:800}.b{font-size:14px;fill:#3d4a43}.was{font-size:15px;fill:#8a958f}.v{font-size:26px;font-weight:800;fill:#0f5132}.box{fill:#fffdfa;stroke:#cfd8d2;stroke-width:2}.hot{fill:#eef6f0;stroke:#6aa47f;stroke-width:2}.ln{stroke:#66736c;stroke-width:2.5;fill:none}</style></defs><rect width="1200" height="675" fill="#f7f5ef"/><text x="40" y="62" class="h">AI Coding Agent Platform</text><text x="40" y="94" class="s">Device policy guard · usage collection server · memory limits reordered</text><rect x="40" y="124" width="352" height="118" rx="12" class="box"/><text x="64" y="152" class="k">1 · GUARD</text><text x="64" y="184" class="t">Device policy guard</text><text x="64" y="214" class="b">Selective checks · signed rules</text><path d="M394 183h24" class="ln" marker-end="url(#a)"/><rect x="424" y="124" width="352" height="118" rx="12" class="box"/><text x="448" y="152" class="k">2 · COLLECT</text><text x="448" y="184" class="t">Usage collection</text><text x="448" y="214" class="b">Raw transcript sync · ClickHouse</text><path d="M778 183h24" class="ln" marker-end="url(#a)"/><rect x="808" y="124" width="352" height="118" rx="12" class="box"/><text x="832" y="152" class="k">3 · OPERATE</text><text x="832" y="184" class="t">Stabilization</text><text x="832" y="214" class="b">Limit order · alerts that reach</text><rect x="40" y="274" width="352" height="306" rx="14" class="hot"/><text x="64" y="306" class="k">MACOS · WINDOWS</text><text x="64" y="340" class="t">Devices enforcing policy</text><text x="64" y="388" class="was">92 people assigned</text><text x="64" y="410" class="s">↓</text><text x="64" y="446" class="v">All 87 enforce</text><path d="M64 474h304" stroke="#cfd8d2" stroke-width="1.5"/><text x="64" y="506" class="b">Counts reporting online devices</text><text x="64" y="534" class="b">Registration · heartbeats · events</text><rect x="424" y="274" width="352" height="306" rx="14" class="hot"/><text x="448" y="306" class="k">AWS · LIVE</text><text x="448" y="340" class="t">Collection outages</text><text x="448" y="388" class="was">2d 18h · then ~17h</text><text x="448" y="410" class="s">↓</text><text x="448" y="446" class="v">3 limits reset</text><path d="M448 474h304" stroke="#cfd8d2" stroke-width="1.5"/><text x="448" y="506" class="b">ClickHouse budget · container limits</text><text x="448" y="534" class="b">App &lt; container &lt; host</text><rect x="808" y="274" width="352" height="306" rx="14" class="hot"/><text x="832" y="306" class="k">AWS · LIVE</text><text x="832" y="340" class="t">Largest-file parse peak</text><text x="832" y="388" class="was">Worker heap 2,048MB &gt; host</text><text x="832" y="410" class="s">↓</text><text x="832" y="446" class="v">427.8MiB · 67%</text><path d="M832 474h304" stroke="#cfd8d2" stroke-width="1.5"/><text x="832" y="506" class="b">Within the 640MiB limit · streaming</text><text x="832" y="534" class="b">O(n²) reparse left as follow-up</text><text x="40" y="626" class="s">Public reconstruction · internal names, hosts, and policy rules left out · 87 counts devices, not people</text></svg>
