<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Family Budget 운영 제품 경계</title><desc id="desc">가족 구성원과 승인형 도우미가 인증 API를 통해 운영 원장에 접근하고 과거 스프레드시트와 공개 데모는 별도 경계에 둔다.</desc><defs><style>.title{font:700 32px system-ui,sans-serif;fill:#111827}.head{font:700 18px system-ui,sans-serif;fill:#111827}.body{font:500 14px system-ui,sans-serif;fill:#475569}.box{fill:#fff;stroke:#334155;stroke-width:2}.muted{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.evidence{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.arrow{stroke:#111827;stroke-width:2;fill:none;marker-end:url(#m)}.dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:7 7;marker-end:url(#m)}.note{font:700 15px system-ui,sans-serif;fill:#047857}</style><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#111827"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><text x="48" y="62" class="title">운영 제품 경계와 공개 증거</text><rect x="48" y="110" width="220" height="145" rx="14" class="box"/><text x="68" y="148" class="head">가족 구성원</text><text x="68" y="180" class="body">모바일 빠른 입력</text><text x="68" y="203" class="body">데스크톱 검토</text><rect x="330" y="110" width="220" height="145" rx="14" class="box"/><text x="350" y="148" class="head">승인형 도우미</text><text x="350" y="180" class="body">요청 미리보기</text><text x="350" y="203" class="body">명시적 승인</text><rect x="612" y="110" width="250" height="145" rx="14" class="box"/><text x="632" y="148" class="head">인증 API</text><text x="632" y="180" class="body">검증 · 트랜잭션</text><text x="632" y="203" class="body">read-back</text><rect x="924" y="110" width="228" height="145" rx="14" class="box"/><text x="944" y="148" class="head">운영 원장</text><text x="944" y="180" class="body">규칙 · occurrence</text><text x="944" y="203" class="body">actual · variance</text><rect x="48" y="350" width="250" height="130" rx="14" class="muted"/><text x="68" y="388" class="head">과거 스프레드시트</text><text x="68" y="420" class="body">읽기 전용 가져오기</text><text x="68" y="443" class="body">현재 write 금지</text><rect x="475" y="350" width="250" height="130" rx="14" class="evidence"/><text x="495" y="388" class="head">Canonical UI package</text><text x="495" y="420" class="body">공개 가능한 화면 계약</text><text x="495" y="443" class="body">운영 데이터 제외</text><rect x="902" y="350" width="250" height="130" rx="14" class="evidence"/><text x="922" y="388" class="head">합성 공개 데모</text><text x="922" y="420" class="body">브라우저 로컬 seed</text><text x="922" y="443" class="body">보조 공개 증거</text><path d="M268 182 H324" class="arrow"/><path d="M550 182 H606" class="arrow"/><path d="M862 182 H918" class="arrow"/><path d="M173 350 V260 H1038 V261" class="dash"/><path d="M725 415 H896" class="arrow"/><text x="48" y="592" class="note">실제 금융값·가족 식별자·인증 정보는 운영 경계 밖으로 나가지 않습니다.</text></svg>