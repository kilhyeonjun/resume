<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc" font-family="Arial, sans-serif">
  <title>Daesin Dispatch Operations Ledger collection and query architecture</title>
  <desc>The collection flow moves external dispatch data through a singleton KST scheduler and crawler into SQLite. The query flow reads SQLite through Next.js, a Vercel read-only proxy, Traefik, and the active Express slot. Traffic switches only after the inactive slot passes its health check; an operator performs manual rollback on failure.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0 0 9 3.5 0 7Z" fill="#64748b"/>
    </marker>
    <style>
      .lane{fill:#fff;stroke:#cbd5e1;stroke-width:2}.node{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.label{font-size:16px;font-weight:700;fill:#0f172a}.sub{font-size:13px;fill:#475569}.lane-title{font-size:18px;font-weight:700;fill:#1d4ed8}.ops{fill:#eff6ff;stroke:#60a5fa;stroke-width:1.5}
    </style>
  </defs>

  <rect width="1080" height="560" rx="16" fill="#f1f5f9"/>
  <text x="540" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Daesin Dispatch Operations Ledger</text>

  <rect class="lane" x="24" y="58" width="1032" height="176" rx="12"/>
  <text class="lane-title" x="48" y="88">Collection flow</text>
  <rect class="node" x="48" y="108" width="190" height="86" rx="9"/>
  <text class="label" x="143" y="142" text-anchor="middle">External dispatch site</text>
  <text class="sub" x="143" y="166" text-anchor="middle">source system</text>
  <rect class="node" x="286" y="108" width="224" height="86" rx="9"/>
  <text class="label" x="398" y="136" text-anchor="middle">singleton KST scheduler</text>
  <text class="sub" x="398" y="159" text-anchor="middle">Mon–Sat 06:00–20:00</text>
  <text class="sub" x="398" y="179" text-anchor="middle">15/day</text>
  <rect class="node" x="558" y="108" width="208" height="86" rx="9"/>
  <text class="label" x="662" y="142" text-anchor="middle">Crawler</text>
  <text class="sub" x="662" y="166" text-anchor="middle">Cheerio + Axios · EUC-KR</text>
  <rect class="node" x="814" y="108" width="194" height="86" rx="9"/>
  <text class="label" x="911" y="142" text-anchor="middle">Prisma + SQLite</text>
  <text class="sub" x="911" y="166" text-anchor="middle">single data store</text>
  <path class="edge" d="M238 151H286"/><path class="edge" d="M510 151H558"/><path class="edge" d="M766 151H814"/>

  <rect class="lane" x="24" y="254" width="1032" height="176" rx="12"/>
  <text class="lane-title" x="48" y="284">Query flow</text>
  <rect class="node" x="48" y="304" width="160" height="84" rx="9"/>
  <text class="label" x="128" y="338" text-anchor="middle">Next.js Web</text>
  <text class="sub" x="128" y="362" text-anchor="middle">browser query</text>
  <rect class="node" x="246" y="304" width="206" height="84" rx="9"/>
  <text class="label" x="349" y="337" text-anchor="middle">Vercel read-only proxy</text>
  <text class="sub" x="349" y="361" text-anchor="middle">read boundary</text>
  <rect class="node" x="490" y="304" width="150" height="84" rx="9"/>
  <text class="label" x="565" y="338" text-anchor="middle">Traefik</text>
  <text class="sub" x="565" y="362" text-anchor="middle">route switch</text>
  <rect class="node" x="678" y="304" width="178" height="84" rx="9"/>
  <text class="label" x="767" y="338" text-anchor="middle">Express active slot</text>
  <text class="sub" x="767" y="362" text-anchor="middle">read API</text>
  <rect class="node" x="894" y="304" width="114" height="84" rx="9"/>
  <text class="label" x="951" y="338" text-anchor="middle">SQLite</text>
  <text class="sub" x="951" y="362" text-anchor="middle">read</text>
  <path class="edge" d="M208 346H246"/><path class="edge" d="M452 346H490"/><path class="edge" d="M640 346H678"/><path class="edge" d="M856 346H894"/>

  <rect class="ops" x="246" y="458" width="610" height="76" rx="10"/>
  <text class="label" x="270" y="486">Deployment operations</text>
  <text class="sub" x="270" y="512">inactive slot → health check → health-gated switch · failure → operator manual rollback</text>
  <path class="edge" d="M565 458V394"/>
</svg>
