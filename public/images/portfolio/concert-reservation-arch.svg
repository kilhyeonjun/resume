<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 718 280" width="718" height="280" font-family="Arial, sans-serif">

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#9ca3af"/>
    </marker>
    <marker id="arrb" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="718" height="280" fill="#f9fafb" rx="8"/>

  <!-- Title -->
  <text x="359" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">콘서트 예약 시스템 아키텍처</text>
  <text x="359" y="40" text-anchor="middle" font-size="9.5" fill="#6b7280">4-Layer Clean Architecture  |  Redis 대기열  |  낙관적/분산 락  |  Kafka Outbox</text>

  <!-- ──────────────────────────────────────────────
       ROW 1  (y=56)  :  Client  →  Interceptor  →  API Controller
       ────────────────────────────────────────────── -->

  <!-- Client -->
  <rect x="20" y="56" width="88" height="44" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="64" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#111827">Client</text>
  <text x="64" y="90" text-anchor="middle" font-size="9" fill="#6b7280">HTTP 요청</text>

  <!-- → -->
  <line x1="108" y1="78" x2="138" y2="78" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- WaitingQueue Interceptor -->
  <rect x="138" y="56" width="140" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="208" y="74" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">대기열 Interceptor</text>
  <text x="208" y="89" text-anchor="middle" font-size="9" fill="#3b82f6">Redis ZSCORE 활성 여부 확인</text>

  <!-- → -->
  <line x1="278" y1="78" x2="308" y2="78" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- API Controller -->
  <rect x="308" y="56" width="120" height="44" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="368" y="74" text-anchor="middle" font-size="10" font-weight="bold" fill="#111827">API Controller</text>
  <text x="368" y="89" text-anchor="middle" font-size="9" fill="#6b7280">인터페이스 레이어</text>

  <!-- Redis Sorted Set (right side, queue info) -->
  <rect x="570" y="56" width="130" height="58" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="635" y="74" text-anchor="middle" font-size="10" font-weight="bold" fill="#111827">Redis Sorted Set</text>
  <text x="635" y="89" text-anchor="middle" font-size="9" fill="#6b7280">대기큐  score = 입장시간</text>
  <text x="635" y="103" text-anchor="middle" font-size="9" fill="#6b7280">활성큐  score = 만료시간</text>

  <!-- dashed connector: Interceptor ↔ Redis (curved above API Controller) -->
  <path d="M278,66 C350,38 500,38 570,66" stroke="#2563eb" stroke-width="1" stroke-dasharray="5,3" fill="none" marker-end="url(#arrb)"/>

  <!-- ──────────────────────────────────────────────
       ROW 2  (y=130)  :  ConcertFacade  +  WaitingQueueFacade
       ────────────────────────────────────────────── -->

  <!-- ↓ from API Controller -->
  <line x1="368" y1="100" x2="368" y2="130" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ConcertFacade -->
  <rect x="308" y="130" width="120" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="368" y="148" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">ConcertFacade</text>
  <text x="368" y="163" text-anchor="middle" font-size="9" fill="#3b82f6">애플리케이션 레이어</text>

  <!-- WaitingQueueFacade (left branch) -->
  <line x1="308" y1="152" x2="278" y2="152" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="138" y="130" width="140" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="208" y="148" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">WaitingQueueFacade</text>
  <text x="208" y="163" text-anchor="middle" font-size="9" fill="#3b82f6">대기열 상태 관리</text>

  <!-- Redis Cache label (right) -->
  <rect x="570" y="130" width="130" height="44" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="635" y="148" text-anchor="middle" font-size="10" font-weight="bold" fill="#111827">Redis Cache</text>
  <text x="635" y="163" text-anchor="middle" font-size="9" fill="#6b7280">Concert/Schedule  TTL 2분</text>

  <!-- → ConcertFacade → Redis Cache -->
  <line x1="428" y1="152" x2="570" y2="152" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ──────────────────────────────────────────────
       ROW 3  (y=204)  :  Domain objects
       ────────────────────────────────────────────── -->

  <!-- ↓ from ConcertFacade to domain row -->
  <line x1="340" y1="174" x2="240" y2="204" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="368" y1="174" x2="368" y2="204" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="396" y1="174" x2="510" y2="204" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- ConcertSeat -->
  <rect x="160" y="204" width="110" height="52" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="215" y="222" text-anchor="middle" font-size="10" font-weight="bold" fill="#111827">ConcertSeat</text>
  <text x="215" y="237" text-anchor="middle" font-size="9" fill="#6b7280">@Version</text>
  <text x="215" y="250" text-anchor="middle" font-size="9" fill="#dc2626">낙관적 락</text>

  <!-- Wallet -->
  <rect x="310" y="204" width="110" height="52" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="365" y="222" text-anchor="middle" font-size="10" font-weight="bold" fill="#111827">Wallet</text>
  <text x="365" y="237" text-anchor="middle" font-size="9" fill="#6b7280">Redisson</text>
  <text x="365" y="250" text-anchor="middle" font-size="9" fill="#d97706">분산 락</text>

  <!-- Payment -->
  <rect x="460" y="204" width="130" height="52" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="525" y="222" text-anchor="middle" font-size="10" font-weight="bold" fill="#111827">Payment</text>
  <text x="525" y="237" text-anchor="middle" font-size="9" fill="#6b7280">Outbox 트랜잭션</text>
  <text x="525" y="250" text-anchor="middle" font-size="9" fill="#7c3aed">→ Kafka 발행</text>

  <!-- Divider line before storage -->
  <line x1="30" y1="268" x2="688" y2="268" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Storage row -->
  <rect x="160" y="272" width="88" height="0" rx="0" fill="none"/>
  <!-- ↓ to storage labels -->
  <line x1="215" y1="256" x2="215" y2="280" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="365" y1="256" x2="365" y2="280" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="525" y1="256" x2="525" y2="280" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Storage labels -->
  <text x="215" y="276" text-anchor="middle" font-size="10" font-weight="bold" fill="#374151">MySQL</text>
  <text x="365" y="276" text-anchor="middle" font-size="10" font-weight="bold" fill="#374151">Redis</text>
  <text x="525" y="276" text-anchor="middle" font-size="10" font-weight="bold" fill="#374151">Kafka (payment-success)</text>

</svg>
